name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: devaaradhya99
          outputs: |
            dist/github-snake-dark.svg?color_snake=green&color_dots=%230e4429,%23006d32,%2326a641,%2339d353
            dist/github-snake.svg?color_snake=white&color_dots=%23e4e2e2,%239be9a8,%2340c463,%2330a14e,%23216e39

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}